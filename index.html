<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Form">
    <meta name="keywords" content="Űrlap">
    <meta name="author" content="Papp Áron">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stilus.css">
    <link rel="stylesheet" href="flex.css">
    <title> Űrlap / Papp Áron</title>
</head>
<body>
    <main>
        <header>
            <h1>Űrlap</h1>
        </header>
        <nav>
            <ul>
                <li><a href="index.html">Menü1</a></li>
                <li><a href="index.html">Menü2</a></li>
                <li><a href="index.html">Menü3</a></li>
            </ul>
        </nav>
        <article>
            <form >

                <fieldset class="adat">
                    <legend>Személyes adatok</legend>
                
                    <div class="nev">
                        <label for="nev">Név: </label>
                        <input type="text" id="nev" name="nev" placeholder="Vezetéknév Keresztnév">
                    </div>


                    <div class="psw">
                        <label for="psw">Jelszó</label>
                        <input type="password" name="psw" id="psw">
                    </div>


                    <div class="email">
                        <label for="email">Email: </label>
                        <input type="email" name="email" id="email" placeholder="email@gmail.com">
                    </div>
                </fieldset>

                <fieldset class="nem">
                    <legend>Nem</legend>
                
                    <div class="nem">
                        <label for="ferfinem">Férfi </label>
                        <input type="radio" id="ferfinem" name="ferfinem" value="ferfinem">
                    </div>


                    <div class="nem">
                        <label for="noinem">Nő</label>
                        <input type="radio" id="noinem" name="noinem" value="noinem">
                    </div>

                </fieldset>

                <fieldset class="hobbi">
                    <legend>Hobbi - többet is bejelölhetsz</legend>
                
                    <div class="hobbi">
                        <label for="hobbi">Biciklizés </label>
                        <input type="checkbox" id="hobbi" name="hobbi" value="hobbi">
                    </div>


                    <div class="hobbi">
                        <label for="hobbi">Fotózás</label>
                        <input type="checkbox" id="hobbi" name="hobbi" value="hobbi">
                    </div>

                    <div class="hobbi">
                        <label for="hobbi">Zenélés</label>
                        <input type="checkbox" id="hobbi" name="hobbi" value="hobbi">
                    </div>

                </fieldset>

                <fieldset class="lokacio">
                    <legend>Lokáció</legend>
                    
                    <label for="orszag">Válaszd ki az országodat: </label>
                    <select name="orszag" id="orszag">
                        <option value="" disabled selected> Kérjük, válassz!</option>
                        <option value="hu">Magyarország</option>
                        <option value="IT">Olaszország</option>
                        <option value="SW">Svájc</option>
                        <option value="AT">Ausztria</option>
                        <option value="DE">Németország</option>
                        <option value="RO">Románia</option>
                        <option value="SK">Szlovákia</option>
                    </select>

                </fieldset>


                
                <div class="submit">
                    <input type="submit" value="Küldés">
                </div>
            </form>

        </article>
        <footer>
            <p>Papp Áron</p>
        </footer>
    </main>
</body>
</html>
